name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan reachable history for secrets
        run: python scripts/check_secrets.py --history HEAD
      - name: Install lightweight test dependencies (ML engines mocked)
        run: pip install pytest fastapi httpx python-multipart jinja2 requests psutil rich typer openai python-dotenv
      - run: python -m pytest -q
  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_NO_CACHE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - name: Install locked project from scratch
        run: uv sync --locked --extra test --python 3.12
      - name: Import actual ML engines and check CLI
        run: |
          uv run --no-sync python -c "import torch, whisperx, faster_whisper; from ai_transcriber.transcriber.whisperx_service import WhisperXTranscriber; print('torch:', torch.__version__, 'CUDA wheel:', torch.version.cuda)"
          uv run --no-sync ai-transcriber --help
          uv run --no-sync python -m pytest -q
      - name: Verify Windows CUDA wheels
        if: runner.os == 'Windows'
        run: uv run --no-sync python -c "import torch; assert torch.version.cuda == '12.8'; print('CUDA 12.8 wheel import OK')"
      - name: Check Windows CPU setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup_cpu.ps1
      - name: Verify Windows CPU wheels
        if: runner.os == 'Windows'
        run: uv run --no-sync python -c "import torch, torchaudio, torchvision; assert torch.version.cuda is None; print('CPU wheel import OK')"
